spring.application.name=smart-finance-api

# Render (and most hosts) tell the app which port to use through PORT.
server.port=${PORT:5000}

# Secrets come from environment variables only. Never write real values here.
# MONGO_URI example: mongodb+srv://<user>:<password>@<cluster>/finance
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/finance}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-days=7

# Comma-separated list of websites allowed to call this API ("*" allows Vercel preview links).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://smart-finance-assistant.vercel.app,https://smart-finance-assistant-*-devisri4s-projects.vercel.app}

# ---- AI assistant ----
# Any OpenAI-compatible provider works; switch provider by changing these three env vars.
# Default: Groq free tier. The key comes ONLY from the AI_API_KEY environment variable.
# "not-configured" lets the app start without a key; the chat endpoint then says it is not set up.
spring.ai.openai.api-key=${AI_API_KEY:not-configured}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${AI_MODEL:openai/gpt-oss-20b}
# Low temperature = steadier, more factual answers.
spring.ai.openai.chat.options.temperature=0.2
# We only chat. Switch off the other OpenAI features so they don't load.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# Give up on a slow AI provider instead of hanging, and retry at most once.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=20s
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=4s
# Chat limits (kept in memory). "everyone" keeps all users together inside Groq's free daily quota.
app.assistant.limit.user-per-minute=10
app.assistant.limit.user-per-day=60
app.assistant.limit.demo-ip-per-minute=5
app.assistant.limit.demo-ip-per-day=20
app.assistant.limit.everyone-per-day=${AI_DAILY_LIMIT:50}
# Render sits behind Cloudflare, which puts the real visitor IP in this header.
app.client-ip-header=CF-Connecting-IP
